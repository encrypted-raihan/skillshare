name: Fix landing page client boundary

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mark landing page as a client component
        run: |
          if ! head -n 1 app/page.tsx | grep -q "use client"; then
            sed -i "1i'use client'" app/page.tsx
          fi

      - name: Commit fix and remove temporary workflow
        run: |
          rm -f .github/workflows/fix-page-client.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx .github/workflows/fix-page-client.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: mark landing page as client component"
          git push
